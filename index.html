<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>My Amsterdam</title>
  <meta name="description" content="A personal city guide: neighbourhoods, sights and food on a map." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='13' r='7' fill='%23E8590C'/><path d='M16 30 9 17h14z' fill='%23E8590C'/><circle cx='16' cy='13' r='3' fill='white'/></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
        integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
  <script src="theme.js"></script>
</head>
<body>
  <div class="app">
    <aside id="panel" class="panel" aria-label="Catalogue" data-snap="peek">
      <header class="panel-head">
        <!-- On phones this top strip is the drag handle of the bottom sheet -->
        <div class="sheet-top">
          <div class="grabber" aria-hidden="true"></div>
          <div class="title-row">
            <h1 id="title">My Amsterdam</h1>
            <span id="count-mobile" class="count"></span>
          </div>
          <p id="subtitle" class="subtitle"></p>
        </div>

        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 4.03 11.6l4.43 4.43 1.06-1.06-4.43-4.43A6.5 6.5 0 0 0 10.5 4Zm0 1.5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z"/></svg>
          <input id="search" type="search" placeholder="Search places, tags, descriptions…" autocomplete="off" />
        </label>

        <div class="filter-block">
          <div class="filter-label">Type</div>
          <div id="type-chips" class="chips" role="group" aria-label="Filter by type"></div>
        </div>

        <div class="filter-block">
          <div class="filter-label">Tags</div>
          <div id="tag-chips" class="chips chips-small" role="group" aria-label="Filter by tag"></div>
        </div>

        <div class="filter-row">
          <select id="district-select" aria-label="Filter by district"></select>
          <span id="count" class="count"></span>
          <button id="clear" class="link-btn" type="button" hidden>Clear filters</button>
        </div>
      </header>

      <div id="list" class="list" role="list"></div>
    </aside>

    <div class="map-wrap">
      <main id="map" class="map" aria-label="Map"></main>
      <div class="map-ui">
        <button id="back-pill" class="pill" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg>
          <span>All districts</span>
        </button>
        <button id="locate" class="round-btn" type="button" aria-label="Show my location" title="Show my location">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm8.94 3A9 9 0 0 0 13 3.06V1h-2v2.06A9 9 0 0 0 3.06 11H1v2h2.06A9 9 0 0 0 11 20.94V23h2v-2.06A9 9 0 0 0 20.94 13H23v-2h-2.06ZM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14Z"/></svg>
        </button>
        <button id="theme" class="round-btn theme-btn" type="button" aria-label="Switch day / night" title="Switch day / night">
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.3 3a9 9 0 1 0 8.7 11.3A7 7 0 0 1 12.3 3Z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10ZM11 1h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3zM4.22 5.64l1.42-1.42 2.12 2.12-1.42 1.42zm12.02 12.02 1.42-1.42 2.12 2.12-1.42 1.42zM4.22 18.36l2.12-2.12 1.42 1.42-2.12 2.12zM16.24 6.34l2.12-2.12 1.42 1.42-2.12 2.12z"/></svg>
        </button>
      </div>
    </div>

    <!-- Phones: place details slide up from the bottom instead of a map popup -->
    <section id="detail" class="detail" aria-label="Place details">
      <div class="grabber" aria-hidden="true"></div>
      <button id="detail-close" class="detail-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></svg>
      </button>
      <div id="detail-body" class="detail-body"></div>
    </section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Base map: OpenFreeMap vector tiles (free, no API key), rendered by MapLibre inside Leaflet -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
          integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin=""></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"
          integrity="sha384-4CB9Vtol9LN6lGgBCvmPLbUEZwilrqIvPieSRurgAXAB7FVJaLS9n8WyAIA5wjQ+" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
